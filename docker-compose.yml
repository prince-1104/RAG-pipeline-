services:
  api:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]

  worker:
    build: .
    env_file:
      - .env
    volumes:
      - ./:/app
    command: ["python", "-m", "app.worker"]


